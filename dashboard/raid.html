<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peon-Ping — Boss Raids</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230d1a2e' stroke='%234488cc' stroke-width='2.5'/><circle cx='32' cy='26' r='14' fill='%234488ff' opacity='0.15'/><path d='M19 56C19 34 23 20 32 14C41 20 45 34 45 56' fill='%231a3a6a'/><path d='M23 54C23 36 26 24 32 18C38 24 41 36 41 54' fill='%230d2244'/><ellipse cx='32' cy='33' rx='7' ry='8' fill='%23f0d0a0'/><path d='M25 31C25 23 32 18 32 18C32 18 39 23 39 31' fill='%23e8c030'/><path d='M25 31C23 37 24 43 25 46' stroke='%23e8c030' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M39 31C41 37 40 43 39 46' stroke='%23e8c030' stroke-width='3' fill='none' stroke-linecap='round'/><ellipse cx='29' cy='33' rx='1.5' ry='1.2' fill='%2366ccff'/><ellipse cx='35' cy='33' rx='1.5' ry='1.2' fill='%2366ccff'/><path d='M30 37Q32 38.5 34 37' stroke='%23c8a080' stroke-width='0.8' fill='none'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e14;
  --panel: #111820;
  --border: #1a2a3a;
  --gold: #c8a030;
  --gold-dim: #8a7020;
  --text: #c0c8d0;
  --text-dim: #607080;
  --red: #c04040;
  --green: #40a060;
  --blue: #4080c0;
  --purple: #8040c0;
  --orange: #c08030;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; }
a { color: var(--gold); text-decoration: none; }
a:hover { color: #e0c050; }

.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.top-bar h1 { font-family: 'Cinzel', serif; font-size: 1.4em; color: var(--gold); }
.top-bar .nav-link { font-size: 0.9em; }
.top-bar .res { font-size: 0.85em; color: var(--text-dim); }
.top-bar .res span { color: var(--gold); margin-left: 4px; }

.container { max-width: 1000px; margin: 0 auto; padding: 24px; }

.section-title {
  font-family: 'Cinzel', serif; font-size: 1.1em; color: var(--gold);
  margin-bottom: 16px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}

/* Active raid */
.active-raid { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0; margin-bottom: 24px; position: relative; overflow: hidden; }
.boss-art-wrap {
  position: relative; width: 100%; height: 360px; overflow: hidden;
  background: #0a0e14;
}
.boss-art-img {
  width: 100%; height: 100%; object-fit: cover; object-position: center 20%;
  opacity: 0.65; transition: opacity 0.5s;
}
.boss-art-wrap::after {
  content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
  background: linear-gradient(to top, var(--panel) 0%, transparent 100%);
}
.boss-art-info {
  position: absolute; bottom: 14px; left: 24px; right: 24px; z-index: 1;
}
.boss-art-name {
  font-family: 'Cinzel', serif; font-size: 1.8em; font-weight: 900; color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
}
.boss-body { padding: 16px 24px 24px; }
.boss-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.boss-icon { font-size: 3em; line-height: 1; }
.boss-icon img { width: 48px; height: 48px; image-rendering: pixelated; }
.boss-name { font-family: 'Cinzel', serif; font-size: 1.6em; color: #fff; }
.boss-mod { display: inline-block; font-size: 0.7em; padding: 2px 8px; border-radius: 4px; margin-left: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }

.hp-bar-container { margin: 12px 0; }
.hp-bar-bg { background: #1a1a2a; border-radius: 6px; height: 32px; overflow: hidden; position: relative; border: 1px solid #333; }
.hp-bar-fill { height: 100%; transition: width 0.5s ease; border-radius: 5px; }
.hp-bar-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 700; font-size: 0.95em; color: #fff; text-shadow: 0 1px 3px #000; }
.hp-high { background: linear-gradient(90deg, #40a060, #60c080); }
.hp-mid { background: linear-gradient(90deg, #c08030, #e0a040); }
.hp-low { background: linear-gradient(90deg, #c04040, #e06060); }

.raid-stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px; }
.raid-stat { text-align: center; }
.raid-stat .label { font-size: 0.75em; color: var(--text-dim); text-transform: uppercase; }
.raid-stat .value { font-size: 1.3em; font-weight: 700; color: var(--gold); }

/* Boss grid */
.boss-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.boss-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; cursor: pointer; transition: all 0.2s;
}
.boss-card:hover:not(.locked) { border-color: var(--gold); transform: translateY(-2px); }
.boss-card.locked { opacity: 0.45; cursor: not-allowed; }
.boss-card .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.boss-card .card-icon { font-size: 2em; }
.boss-card .card-name { font-family: 'Cinzel', serif; font-size: 1em; color: #ddd; }
.boss-card .card-stats { font-size: 0.8em; color: var(--text-dim); margin-top: 4px; }
.boss-card .card-stats span { color: var(--text); }
.boss-card .lock-reason { font-size: 0.75em; color: var(--red); margin-top: 6px; }
.boss-card .kills-badge { font-size: 0.75em; color: var(--green); margin-top: 4px; }

.loot-common { color: #c0c8d0; }
.loot-uncommon { color: #40c060; }
.loot-rare { color: #4080ff; }
.loot-epic { color: #a040e0; }
.loot-legendary { color: #ff8000; }

/* History */
.history-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
.history-table th { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 400; text-transform: uppercase; font-size: 0.8em; }
.history-table td { padding: 8px; border-bottom: 1px solid #0f161f; }
.result-victory { color: var(--green); font-weight: 700; }
.result-escaped { color: var(--red); font-weight: 700; }

/* Confirm dialog */
.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
.overlay.active { display: flex; }
.confirm-box {
  background: var(--panel); border: 2px solid var(--gold); border-radius: 12px;
  padding: 32px; max-width: 400px; text-align: center;
}
.confirm-box h3 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 12px; font-size: 1.2em; }
.confirm-box p { margin-bottom: 16px; font-size: 0.9em; color: var(--text-dim); }
.confirm-box .warn { color: var(--red); font-weight: 700; }
.btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.9em; }
.btn-gold { background: var(--gold); color: #000; }
.btn-gold:hover { background: #e0c050; }
.btn-cancel { background: #333; color: #aaa; margin-left: 8px; }
.btn-cancel:hover { background: #444; }
.btn-red { background: #6a2020; color: #eaa; border: 1px solid #a04040; }
.btn-red:hover { background: #802828; }

.surrender-wrap { text-align: right; margin-top: 16px; }

.battle-log { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; max-height: 300px; overflow-y: auto; font-size: 0.85em; font-family: 'Courier New', monospace; }
.blog-entry { padding: 4px 0; border-bottom: 1px solid #0f161f; display: flex; gap: 12px; }
.blog-entry:last-child { border-bottom: none; }
.blog-ts { color: var(--text-dim); min-width: 60px; }
.blog-dmg { color: var(--green); min-width: 70px; }
.blog-dmg.zero { color: var(--text-dim); }
.blog-hp { color: var(--text); min-width: 90px; }
.blog-counter { color: var(--red); }
.blog-combo { color: var(--gold); font-size: 0.9em; }
.blog-item { color: var(--orange); font-weight: 700; }
.blog-item img { width: 16px; height: 16px; image-rendering: pixelated; vertical-align: text-bottom; }

.use-items { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
.use-items-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.use-item-btn {
  background: #1a1230; border: 1px solid #4a2060; border-radius: 6px; padding: 8px 14px;
  cursor: pointer; font-size: 0.85em; color: var(--text); font-family: inherit; transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.use-item-btn:hover { border-color: var(--orange); background: #2a1a40; }
.use-item-btn .ui-dmg { color: var(--orange); font-weight: 700; }
.use-item-btn.r-uncommon { border-color: rgba(64,192,96,0.4); }
.use-item-btn.r-uncommon:hover { border-color: #40c060; }
.use-item-btn.r-rare { border-color: rgba(64,128,255,0.4); }
.use-item-btn.r-rare:hover { border-color: #4080ff; }
.use-item-btn.r-epic { border-color: rgba(160,64,224,0.4); }
.use-item-btn.r-epic:hover { border-color: #a040e0; }
.use-item-btn.r-legendary { border-color: rgba(255,128,0,0.4); }
.use-item-btn.r-legendary:hover { border-color: #ff8000; }
.blog-defeat { color: var(--gold); font-weight: 700; font-size: 1.1em; padding: 8px 0; }

.no-portal { text-align: center; padding: 12px 20px; color: var(--text-dim); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; }
.no-portal strong { color: var(--gold); }

/* Result overlay */
.result-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 200; align-items: center; justify-content: center;
  animation: resultFadeIn 0.4s ease-out;
}
.result-overlay.active { display: flex; }
@keyframes resultFadeIn { from { opacity: 0; } to { opacity: 1; } }

.result-overlay.victory { background: radial-gradient(ellipse at center, rgba(40,32,10,0.95) 0%, rgba(10,14,20,0.97) 70%); }
.result-overlay.defeat { background: radial-gradient(ellipse at center, rgba(40,10,10,0.95) 0%, rgba(10,14,20,0.97) 70%); }

.result-box {
  text-align: center; max-width: 460px; width: 90%; padding: 40px 32px;
  background: var(--panel); border-radius: 14px; position: relative; overflow: hidden;
}
.result-boss-art {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center 20%; opacity: 0.15; z-index: 0;
  animation: resultSlide 0.8s ease-out both;
}
.result-overlay.victory .result-box { border: 2px solid var(--gold); box-shadow: 0 0 60px rgba(200,160,48,0.25), 0 0 120px rgba(200,160,48,0.1); }
.result-overlay.defeat .result-box { border: 2px solid var(--red); box-shadow: 0 0 60px rgba(192,64,64,0.2); }

.result-icon { font-size: 4em; margin-bottom: 8px; animation: resultPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s both; }
@keyframes resultPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.result-title {
  font-family: 'Cinzel', serif; font-size: 2em; font-weight: 900; margin-bottom: 4px;
  animation: resultSlide 0.5s ease-out 0.3s both;
}
@keyframes resultSlide { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.result-overlay.victory .result-title { color: var(--gold); text-shadow: 0 0 20px rgba(200,160,48,0.4); }
.result-overlay.defeat .result-title { color: var(--red); text-shadow: 0 0 20px rgba(192,64,64,0.3); }

.result-boss { font-family: 'Cinzel', serif; font-size: 1.1em; color: #ddd; margin-bottom: 20px; animation: resultSlide 0.5s ease-out 0.4s both; }

.result-rewards {
  display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
  margin-bottom: 24px; animation: resultSlide 0.5s ease-out 0.5s both;
}
.result-reward { text-align: center; }
.result-reward .rw-val { font-size: 1.6em; font-weight: 900; font-family: 'Cinzel', serif; }
.result-reward .rw-lbl { font-size: 0.75em; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.result-overlay.victory .rw-gold { color: var(--gold); }
.result-overlay.victory .rw-lumber { color: var(--green); }
.result-overlay.defeat .rw-gold { color: var(--red); }

.result-drops {
  margin-bottom: 24px; animation: resultSlide 0.5s ease-out 0.6s both;
}
.result-drops-title { font-size: 0.8em; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
.result-drop-item {
  display: inline-block; padding: 6px 14px; margin: 3px;
  border-radius: 6px; font-weight: 700; font-size: 0.9em;
  background: rgba(255,128,0,0.1); border: 1px solid rgba(255,128,0,0.3); color: #ff8000;
}
.loot-slots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.loot-slot { display: inline-block; position: relative; }
.loot-inner {
  padding: 7px 16px; border-radius: 6px; font-weight: 700; font-size: 0.9em;
  min-width: 70px; text-align: center; white-space: nowrap;
}
.loot-slot.sealed .loot-inner {
  background: #1a1a2a; border: 1px dashed #444; color: #555;
  animation: lootPulse 1.4s ease-in-out infinite;
}
.loot-slot.revealed .loot-inner { animation: lootPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }
.loot-slot.revealed.lr-common .loot-inner { background: rgba(136,136,136,0.12); border: 1px solid #888; color: #ccc; }
.loot-slot.revealed.lr-uncommon .loot-inner { background: rgba(30,255,0,0.08); border: 1px solid #1eff00; color: #1eff00; box-shadow: 0 0 12px rgba(30,255,0,0.25); }
.loot-slot.revealed.lr-rare .loot-inner { background: rgba(0,112,221,0.1); border: 1px solid #0070dd; color: #0070dd; box-shadow: 0 0 16px rgba(0,112,221,0.35); }
.loot-slot.revealed.lr-epic .loot-inner { background: rgba(163,53,238,0.1); border: 1px solid #a335ee; color: #a335ee; box-shadow: 0 0 22px rgba(163,53,238,0.4); }
.loot-slot.revealed.lr-legendary .loot-inner { background: rgba(255,128,0,0.12); border: 1px solid #ff8000; color: #ff8000; box-shadow: 0 0 28px rgba(255,128,0,0.5), 0 0 60px rgba(255,128,0,0.15); }
@keyframes lootPulse {
  0%, 100% { box-shadow: 0 0 5px rgba(200,160,48,0.08); border-color: #444; }
  50% { box-shadow: 0 0 14px rgba(200,160,48,0.22); border-color: #666; }
}
@keyframes lootPop {
  0% { transform: scale(0) rotateY(90deg); opacity: 0; }
  60% { transform: scale(1.25) rotateY(-8deg); opacity: 1; }
  100% { transform: scale(1) rotateY(0); opacity: 1; }
}
.loot-spark {
  position: absolute; border-radius: 50%; pointer-events: none;
  transition: transform 0.6s ease-out, opacity 0.6s ease-out;
}
.loot-flash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 300;
  animation: lootFlash 0.35s ease-out forwards;
}
@keyframes lootFlash { 0% { opacity: 0.5; } 100% { opacity: 0; } }
.loot-shake { animation: lootShake 0.3s ease-out; }
@keyframes lootShake {
  0%, 100% { transform: translate(0,0); }
  20% { transform: translate(-3px, 2px); }
  40% { transform: translate(3px, -2px); }
  60% { transform: translate(-2px, -1px); }
  80% { transform: translate(2px, 1px); }
}

.result-flavor {
  font-style: italic; color: var(--text-dim); font-size: 0.85em;
  margin-bottom: 24px; animation: resultSlide 0.5s ease-out 0.55s both;
}

.btn-new-raid {
  padding: 12px 32px; border: none; border-radius: 8px; cursor: pointer;
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.1em;
  transition: all 0.2s; animation: resultSlide 0.5s ease-out 0.7s both;
}
.result-overlay.victory .btn-new-raid { background: var(--gold); color: #000; }
.result-overlay.victory .btn-new-raid:hover { background: #e0c050; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(200,160,48,0.3); }
.result-overlay.defeat .btn-new-raid { background: var(--red); color: #fff; }
.result-overlay.defeat .btn-new-raid:hover { background: #d05050; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(192,64,64,0.3); }

/* shimmer on victory box */
.result-overlay.victory .result-box::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(200,160,48,0.06), transparent, rgba(200,160,48,0.06));
  animation: resultShimmer 4s linear infinite;
}
@keyframes resultShimmer { to { transform: rotate(360deg); } }
.result-box > * { position: relative; z-index: 1; }

/* particles on victory */
.result-particles {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden;
}
.result-particle {
  position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--gold);
  animation: particleFall linear infinite;
}
@keyframes particleFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>&#x1F52E; Dark Portal — Boss Raids</h1>
  <div class="res">Gold: <span id="gold">0</span> | Lumber: <span id="lumber">0</span></div>
  <a class="nav-link" href="/army">&#x1F6E1;&#xFE0F; Army</a> &nbsp; <a class="nav-link" href="/">&#x2190; Base</a>
</div>

<div class="container">
  <div id="no-portal" class="no-portal" style="display:none">
    <p>&#x1F512; Build the <strong>Dark Portal</strong> to unlock boss raids. (12,000g / 5,000l &middot; Requires Fortress)</p>
  </div>

  <div id="active-section" style="display:none">
    <div class="section-title">Active Raid</div>
    <div class="active-raid" id="active-raid"></div>
  </div>

  <div id="items-section" style="display:none">
    <div class="section-title">Use Items</div>
    <div class="use-items" id="use-items"></div>
  </div>

  <div id="log-section" style="display:none">
    <div class="section-title">Battle Log</div>
    <div class="battle-log" id="battle-log"></div>
  </div>

  <div id="select-section">
    <div class="section-title">Choose Your Boss</div>
    <div class="boss-grid" id="boss-grid"></div>
  </div>

  <div id="history-section" style="display:none">
    <div class="section-title">Raid History</div>
    <table class="history-table">
      <thead><tr><th>Boss</th><th>Result</th><th>Reward / Penalty</th><th>Drops</th><th>Date</th></tr></thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirm-name"></h3>
    <p id="confirm-details"></p>
    <p class="warn">No retreat. No surrender.</p>
    <button class="btn btn-gold" id="confirm-btn">Begin Raid</button>
    <button class="btn btn-cancel" id="cancel-btn">Cancel</button>
  </div>
</div>

<div class="overlay" id="surrender-overlay">
  <div class="confirm-box">
    <h3>&#x1F3F3;&#xFE0F; Surrender?</h3>
    <p id="surrender-details"></p>
    <button class="btn btn-red" id="surrender-btn">Surrender</button>
    <button class="btn btn-cancel" id="surrender-cancel">Keep Fighting</button>
  </div>
</div>

<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <div class="result-particles" id="result-particles"></div>
    <div class="result-icon" id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-boss" id="result-boss"></div>
    <div class="result-flavor" id="result-flavor"></div>
    <div class="result-rewards" id="result-rewards"></div>
    <div class="result-drops" id="result-drops"></div>
    <button class="btn-new-raid" id="btn-new-raid">New Raid</button>
  </div>
</div>

<script>
var W3 = 'https://raw.githubusercontent.com/aaronjewell/w3-icons/main/images/';
function w3img(p) { return '<img src="' + W3 + p + '" style="width:36px;height:36px;image-rendering:pixelated">'; }

var BOSS_ART = 'assets/bosses/';
var BOSSES = {

var pendingBoss = null;
var prevBossId = null;
var prevHistLen = 0;
var resultShown = false;

function $(id) { return document.getElementById(id); }

function apiPost(url, data) {
  return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).then(function(r){return r.json();});
}

function poll() {
  fetch('/api/state').then(function(r){return r.json();}).then(render).catch(function(){});
}

function render(s) {
  var ec = s.economy || {};
  $('gold').textContent = ec.gold || 0;
  $('lumber').textContent = ec.lumber || 0;
  var buildings = s.buildings || {};
  var boss = s.active_boss;
  var bk = s.boss_kills || {};
  var bkTotal = s.boss_kills_total || 0;
  var lvl = (s.stats || {}).level || 1;

  var hasPortal = !!buildings.dark_portal;
  $('no-portal').style.display = hasPortal ? 'none' : '';

  var hist = s.boss_history || [];
  var curBossId = (boss && boss.hp > 0) ? boss.id : null;

  if (prevBossId && !curBossId && hist.length > prevHistLen && !resultShown) {
    var latest = hist[hist.length - 1];
    if (latest) showResult(latest);
  }

  prevBossId = curBossId;
  prevHistLen = hist.length;

  var inv = (s.inventory || []).concat(s.equipped || []);
  if (hasPortal && boss && boss.hp > 0) {
    $('active-section').style.display = '';
    $('select-section').style.display = 'none';
    $('log-section').style.display = '';
    renderActiveBoss(boss);
    renderBossItems(inv, boss);
    renderBattleLog(boss);
  } else if (!resultShown) {
    $('active-section').style.display = 'none';
    $('items-section').style.display = 'none';
    $('log-section').style.display = 'none';
    $('select-section').style.display = '';
    renderBossGrid(buildings, bk, bkTotal, lvl, ec, hasPortal);
  }

  if (hist.length > 0) {
    $('history-section').style.display = resultShown ? 'none' : '';
    renderHistory(hist);
  } else {
    $('history-section').style.display = 'none';
  }
}

var BOSS_ITEMS = {
  firebolt:         {name:'Firebolt',             dmg:50,    r:'common',   icon:w3img('human/firebolt.gif')},
  goblin_sapper:    {name:'Goblin Sapper Charge', dmg:100,   r:'common',   icon:w3img('neutral/goblinsapper.gif')},
  storm_bolt:       {name:'Storm Bolt',           dmg:250,   r:'common',   icon:w3img('human/stormbolt.gif')},
  demolisher_shot:  {name:'Demolisher Shot',      dmg:500,   r:'common',   icon:w3img('neutral/demolisher.gif')},
  thunder_clap:     {name:'Thunder Clap',         dmg:750,   r:'uncommon', icon:w3img('orc/thunderclap.png')},
  chain_lightning:  {name:'Chain Lightning',      dmg:2000,  r:'uncommon', icon:w3img('orc/chainlightning.png')},
  death_coil:       {name:'Death Coil',           dmg:5000,  r:'uncommon', icon:w3img('orc/deathcoil.gif')},
  finger_of_death:  {name:'Finger of Death',      dmg:10000, r:'rare',     icon:w3img('undead/fingerofdeath.gif')},
  doom:             {name:'Doom',                 dmg:20000, r:'epic',     icon:w3img('orc/doom.gif')}
};

function renderBossItems(inv, boss) {
  var avail = [];
  inv.forEach(function(iid) { if (BOSS_ITEMS[iid]) avail.push(iid); });
  if (avail.length === 0) {
    $('items-section').style.display = 'none';
    return;
  }
  $('items-section').style.display = '';
  var el = $('use-items');
  el.innerHTML = '<div style="font-size:0.85em;color:var(--text-dim);margin-bottom:8px">Consumables that deal instant damage to ' + boss.name + ':</div><div class="use-items-grid" id="use-items-grid"></div>';
  var grid = $('use-items-grid');
  avail.forEach(function(iid) {
    var bi = BOSS_ITEMS[iid];
    var btn = document.createElement('button');
    btn.className = 'use-item-btn r-' + bi.r;
    btn.innerHTML = bi.icon + ' ' + bi.name + ' <span class="ui-dmg">-' + bi.dmg + ' HP</span>';
    btn.addEventListener('click', function() {
      btn.disabled = true;
      apiPost('/api/use', {item: iid}).then(function(res) {
        if (res.ok) poll();
        else { alert(res.error || 'Failed'); btn.disabled = false; }
      }).catch(function() { btn.disabled = false; });
    });
    grid.appendChild(btn);
  });
}

function renderActiveBoss(boss) {
  var pct = boss.hp / boss.max_hp;
  var barClass = pct > 0.5 ? 'hp-high' : pct > 0.2 ? 'hp-mid' : 'hp-low';
  var dl = boss.deadline || '';
  var dlDate = new Date(dl + 'T23:59:59');
  var now = new Date();
  var msLeft = Math.max(0, dlDate - now);
  var dLeft = Math.floor(msLeft / 86400000);
  var hLeft = Math.floor((msLeft % 86400000) / 3600000);
  var mLeft = Math.floor((msLeft % 3600000) / 60000);
  var timeStr = '';
  if (dLeft > 0) timeStr += dLeft + 'd ';
  if (hLeft > 0 || dLeft > 0) timeStr += hLeft + 'h ';
  timeStr += mLeft + 'm';
  var dmg = boss.max_hp - boss.hp;
  var bossInfo = BOSSES[boss.id] || {};
  var html = '';
  if (bossInfo.art) {
    html += '<div class="boss-art-wrap"><img class="boss-art-img" src="' + bossInfo.art + '" alt="' + boss.name + '"><div class="boss-art-info"><div class="boss-art-name">' + boss.name + '</div></div></div>';
    html += '<div class="boss-body">';
  } else {
    html += '<div class="boss-body" style="padding-top:24px">';
    html += '<div class="boss-header"><span class="boss-icon">' + (bossInfo.icon || '\u2694\uFE0F') + '</span><div><div class="boss-name">' + boss.name + '</div></div></div>';
  }
  html += '<div class="hp-bar-container"><div class="hp-bar-bg"><div class="hp-bar-fill ' + barClass + '" style="width:' + (pct * 100) + '%"></div><div class="hp-bar-text">' + boss.hp + ' / ' + boss.max_hp + ' HP</div></div></div>';
  html += '<div class="raid-stats">';
  html += '<div class="raid-stat"><div class="label">Damage Dealt</div><div class="value">' + dmg + '</div></div>';
  html += '<div class="raid-stat"><div class="label">Time Left</div><div class="value">' + timeStr + '</div></div>';
  html += '<div class="raid-stat"><div class="label">Deadline</div><div class="value" style="font-size:0.9em">' + dl + '</div></div>';
  html += '</div>';
  var log = boss.log || [];
  var hits = log.filter(function(e) { return e.dmg > 0 && !e.counter; });
  if (hits.length > 0) {
    var totals = {base:0, combo:0, items:0, army:0, bloodstone:0, smith:0, execute:0, crit:0, tired:0, item_use:0};
    hits.forEach(function(e) {
      var b = e.bk || {};
      for (var k in totals) { totals[k] += (b[k] || 0); }
    });
    var total = hits.reduce(function(s,e){return s+e.dmg;}, 0);
    html += '<div style="margin-top:16px;font-size:0.85em;color:var(--text-dim)">';
    html += '<div style="margin-bottom:6px;color:var(--gold);font-weight:700">Damage Breakdown (' + total + ' total from ' + hits.length + ' hits)</div>';
    var parts = [];
    if (totals.base) parts.push('Base: ' + totals.base);
    if (totals.combo) parts.push('Combo: +' + totals.combo);
    if (totals.items) parts.push('Items: +' + totals.items);
    if (totals.army) parts.push('Army: +' + totals.army);
    if (totals.bloodstone) parts.push('Bloodstone: +' + totals.bloodstone);
    if (totals.smith) parts.push('Blacksmith: +' + totals.smith);
    if (totals.execute) parts.push('Execute: +' + totals.execute);
    if (totals.crit) parts.push('Crits: +' + totals.crit);
    if (totals.item_use) parts.push('<span style="color:var(--orange)">Consumables: +' + totals.item_use + '</span>');
    if (totals.tired) parts.push('<span style="color:var(--red)">Fatigue: ' + totals.tired + '</span>');
    html += parts.join(' &middot; ');
    if (hits.length > 0) html += ' &middot; Avg: ' + (total / hits.length).toFixed(1) + '/hit';
    html += '</div>';
  }
  var penalty = Math.floor((boss.entry_fee || 0) / 2);
  var penStr = penalty > 0 ? ' (-' + penalty + 'g penalty)' : '';
  html += '<div class="surrender-wrap"><button class="btn btn-red" onclick="promptSurrender(\'' + boss.name + '\', ' + penalty + ')">&#x1F3F3;&#xFE0F; Surrender</button></div>';
  html += '</div>';
  $('active-raid').innerHTML = html;
}

function promptSurrender(name, penalty) {
  var penStr = penalty > 0 ? 'You will lose <strong>' + penalty + 'g</strong> as penalty.' : 'No gold penalty for this boss.';
  $('surrender-details').innerHTML = 'Abandon the fight against <strong>' + name + '</strong>?<br>' + penStr;
  $('surrender-overlay').classList.add('active');
}

function renderBattleLog(boss) {
  var log = boss.log || [];
  var el = $('battle-log');
  if (log.length === 0) {
    el.innerHTML = '<div style="color:var(--text-dim)">No combat yet. Complete tasks to deal damage.</div>';
    return;
  }
  var html = '';
  log.slice().reverse().forEach(function(e) {
    var ts = e.t ? new Date(e.t * 1000).toLocaleTimeString() : '';
    var dmgClass = e.dmg > 0 ? 'blog-dmg' : 'blog-dmg zero';
    var dmgStr = e.dmg > 0 ? '-' + e.dmg + ' HP' : '0 dmg';
    var isItemUse = e.bk && e.bk.item_use && !e.bk.base;
    var itemInfo = null;
    if (isItemUse && e.item && BOSS_ITEMS[e.item]) {
      itemInfo = BOSS_ITEMS[e.item];
    } else if (isItemUse) {
      var itemDmg = e.bk.item_use;
      Object.keys(BOSS_ITEMS).forEach(function(k) { if (BOSS_ITEMS[k].dmg === itemDmg && !itemInfo) itemInfo = BOSS_ITEMS[k]; });
    }
    var comboStr = e.combo ? ' <span class="blog-combo">x' + e.combo + '</span>' : '';
    var counterStr = e.counter ? ' <span class="blog-counter">' + e.counter + '</span>' : '';
    if (e.boss_dmg) counterStr += ' <span class="blog-counter">\u2694 ' + e.boss_dmg + ' dmg to army</span>';
    if (e.boss_atk) counterStr += ' <span class="blog-counter">\u2620 -' + e.boss_atk + ' units</span>';
    var bkStr = '';
    if (isItemUse && itemInfo) {
      bkStr = ' <span class="blog-item">' + itemInfo.icon + ' ' + itemInfo.name + '</span>';
    } else if (e.bk && e.dmg > 0) {
      var bp = [];
      if (e.bk.base) bp.push(e.bk.base);
      if (e.bk.combo) bp.push('+' + e.bk.combo + ' combo');
      if (e.bk.items) bp.push('+' + e.bk.items + ' items');
      if (e.bk.army) bp.push('+' + e.bk.army + ' army');
      if (e.bk.bloodstone) bp.push('+' + e.bk.bloodstone + ' bloodstone');
      if (e.bk.smith) bp.push('+' + e.bk.smith + ' smith');
      if (e.bk.crit) bp.push('+' + e.bk.crit + ' crit');
      if (e.bk.execute) bp.push('+' + e.bk.execute + ' exec');
      if (e.bk.item_use) bp.push('<span style="color:var(--orange)">' + e.bk.item_use + ' item</span>');
      if (e.bk.tired) bp.push('<span style="color:var(--red)">' + e.bk.tired + ' tired</span>');
      if (e.bk.exhausted) bp = ['<span style="color:var(--red)">exhausted</span>'];
      bkStr = ' <span style="color:var(--text-dim);font-size:0.85em">(' + bp.join(' ') + ')</span>';
    }
    html += '<div class="blog-entry"><span class="blog-ts">' + ts + '</span><span class="' + dmgClass + '">' + dmgStr + '</span><span class="blog-hp">' + e.hp + '/' + boss.max_hp + ' HP</span>' + comboStr + bkStr + counterStr + '</div>';
  });
  el.innerHTML = html;
}

function renderBossGrid(buildings, bk, bkTotal, lvl, ec, hasPortal) {
  var grid = $('boss-grid');
  grid.innerHTML = '';
  var gold = ec.gold || 0;
  Object.keys(BOSSES).forEach(function(bid) {
    var b = BOSSES[bid];
    var locked = false;
    var reasons = [];
    if (!hasPortal) { locked = true; reasons.push('Build Dark Portal'); }
    if (bkTotal < b.kills) { locked = true; reasons.push(b.kills + ' boss kills (have ' + bkTotal + ')'); }
    if (lvl < b.lvl) { locked = true; reasons.push('Level ' + b.lvl + '+ (at ' + lvl + ')'); }
    b.bld.forEach(function(rb) { if (!buildings[rb]) { locked = true; reasons.push('Build ' + rb); } });
    var card = document.createElement('div');
    card.className = 'boss-card' + (locked ? ' locked' : '');
    var kills = bk[bid] || 0;
    var feeStr = b.fee ? b.fee + 'g' : 'free';
    var canAfford = gold >= b.fee;
    var html = '<div class="card-top"><span class="card-icon">' + b.icon + '</span><div><div class="card-name">' + b.name + '</div></div></div>';
    html += '<div class="card-stats"><span>' + b.hp + '</span> HP &middot; <span>' + b.days + '</span> day' + (b.days > 1 ? 's' : '') + ' &middot; Entry: <span>' + feeStr + '</span> &middot; Loot: <span class="loot-' + b.loot + '">' + b.drops + 'x ' + b.loot + '</span></div>';
    var penalty = Math.floor(b.fee / 2);
    var atkStr = b.atk_max > 0 ? ' &middot; Attack: <span style="color:var(--red)">' + b.atk_min + '-' + b.atk_max + ' kills/turn</span>' : '';
    html += '<div class="card-stats" style="margin-top:2px">Reward: <span style="color:var(--gold)">' + b.gold + 'g</span> + <span style="color:#5a5">' + b.lumber + 'l</span>' + atkStr + (penalty > 0 ? ' &middot; Fail: <span style="color:var(--red)">-' + penalty + 'g</span>' : '') + '</div>';
    if (kills > 0) html += '<div class="kills-badge">\u2694 Defeated ' + kills + 'x</div>';
    if (locked) html += '<div class="lock-reason">\uD83D\uDD12 ' + reasons.join(' + ') + '</div>';
    else if (!canAfford) html += '<div class="lock-reason">Not enough gold (' + gold + '/' + b.fee + 'g)</div>';
    card.innerHTML = html;
    if (!locked && canAfford) {
      card.addEventListener('click', function() {
        pendingBoss = bid;
        $('confirm-name').textContent = b.name;
        var pen = Math.floor(b.fee / 2);
        var atkInfo = b.atk_max > 0 ? '<br>Boss attack: ' + b.atk_min + '-' + b.atk_max + ' unit kills per turn' : '';
        $('confirm-details').innerHTML = b.hp + ' HP &middot; ' + b.days + ' day' + (b.days > 1 ? 's' : '') + (b.fee ? ' &middot; Entry: ' + b.fee + 'g' : '') + '<br>Reward: ' + b.gold + 'g + ' + b.lumber + 'l &middot; Loot: ' + b.drops + 'x ' + b.loot + ' drop' + (b.drops > 1 ? 's' : '') + atkInfo + (pen > 0 ? '<br>Fail penalty: -' + pen + 'g' : '');
        $('confirm-overlay').classList.add('active');
      });
    }
    grid.appendChild(card);
  });
}

function renderHistory(hist) {
  var body = $('history-body');
  body.innerHTML = '';
  hist.slice().reverse().forEach(function(h) {
    var tr = document.createElement('tr');
    var resultClass = h.result === 'victory' ? 'result-victory' : 'result-escaped';
    var reward = '';
    if (h.result === 'victory') reward = '+' + (h.gold || 0) + 'g +' + (h.lumber || 0) + 'l';
    else reward = '-' + (h.penalty || 0) + 'g';
    var drops = (h.drops || []).join(', ') || '\u2014';
    var dt = h.t ? new Date(h.t * 1000).toLocaleDateString() : '';
    tr.innerHTML = '<td>' + h.name + '</td><td class="' + resultClass + '">' + h.result.toUpperCase() + '</td><td>' + reward + '</td><td>' + drops + '</td><td>' + dt + '</td>';
    body.appendChild(tr);
  });
}

$('confirm-btn').addEventListener('click', function() {
  if (!pendingBoss) return;
  $('confirm-overlay').classList.remove('active');
  apiPost('/api/raid', {boss: pendingBoss}).then(function(res) {

    else alert(res.error || 'Failed');
  }).catch(function() { alert('Request failed'); });
  pendingBoss = null;
});

$('cancel-btn').addEventListener('click', function() {

$('surrender-btn').addEventListener('click', function() {

$('surrender-cancel').addEventListener('click', function() {

var RARITY_COLORS = {common:'#888', uncommon:'#1eff00', rare:'#0070dd', epic:'#a335ee', legendary:'#ff8000'};

function lootRarityByName(name, bossId) {
  if (name.indexOf('(TROPHY)') !== -1) return 'legendary';
  var bi = BOSSES[bossId];
  return (bi && bi.loot) ? bi.loot : 'common';
}

function lootSpawnBurst(el, rarity) {
  var color = RARITY_COLORS[rarity] || '#888';
  var n = rarity === 'legendary' ? 18 : rarity === 'epic' ? 14 : rarity === 'rare' ? 10 : 6;
  for (var i = 0; i < n; i++) {
    var sp = document.createElement('div');
    sp.className = 'loot-spark';
    var angle = (Math.PI * 2 / n) * i + (Math.random() - 0.5) * 0.6;
    var dist = 25 + Math.random() * 35;
    var sz = (2 + Math.random() * 4) + 'px';
    sp.style.width = sz; sp.style.height = sz;
    sp.style.background = color;
    sp.style.left = '50%'; sp.style.top = '50%';
    sp.style.transform = 'translate(-50%,-50%)';
    sp.style.opacity = '1';
    el.appendChild(sp);
    (function(s, a, d) {
      requestAnimationFrame(function() {
        s.style.transform = 'translate(calc(-50% + ' + (Math.cos(a)*d) + 'px), calc(-50% + ' + (Math.sin(a)*d) + 'px))';
        s.style.opacity = '0';
      });
    })(sp, angle, dist);
    (function(s) { setTimeout(function() { if (s.parentNode) s.parentNode.removeChild(s); }, 700); })(sp);
  }
}

function lootFlash(rarity) {
  var bg = rarity === 'legendary' ? 'rgba(255,128,0,0.18)' : rarity === 'epic' ? 'rgba(163,53,238,0.14)' : null;
  if (!bg) return;
  var fl = document.createElement('div');
  fl.className = 'loot-flash';
  fl.style.background = bg;
  document.body.appendChild(fl);
  setTimeout(function() { if (fl.parentNode) fl.parentNode.removeChild(fl); }, 400);
}

function lootShake(el) {
  el.classList.remove('loot-shake');
  void el.offsetWidth;
  el.classList.add('loot-shake');
}

function showResult(entry) {
  resultShown = true;
  var won = entry.result === 'victory';
  var overlay = $('result-overlay');
  overlay.className = 'result-overlay active ' + (won ? 'victory' : 'defeat');

  var oldArt = overlay.querySelector('.result-boss-art');
  if (oldArt) oldArt.remove();
  var rbi = BOSSES[entry.id];
  if (rbi && rbi.art) {
    var artImg = document.createElement('img');
    artImg.className = 'result-boss-art';
    artImg.src = rbi.art;
    artImg.alt = '';
    overlay.querySelector('.result-box').insertBefore(artImg, overlay.querySelector('.result-box').firstChild);
  }

  $('result-icon').textContent = won ? '\u2694\uFE0F' : '\uD83D\uDC80';
  $('result-title').textContent = won ? 'VICTORY' : 'DEFEAT';
  $('result-boss').textContent = entry.name;

  var lines = won ? VICTORY_LINES : DEFEAT_LINES;
  $('result-flavor').textContent = lines[Math.floor(Math.random() * lines.length)];

  var rwHtml = '';
  if (won) {
    rwHtml += '<div class="result-reward"><div class="rw-val rw-gold">+' + (entry.gold || 0) + '</div><div class="rw-lbl">Gold</div></div>';
    rwHtml += '<div class="result-reward"><div class="rw-val rw-lumber">+' + (entry.lumber || 0) + '</div><div class="rw-lbl">Lumber</div></div>';
  } else {
    rwHtml += '<div class="result-reward"><div class="rw-val rw-gold">-' + (entry.penalty || 0) + '</div><div class="rw-lbl">Gold Lost</div></div>';
  }
  $('result-rewards').innerHTML = rwHtml;

  var drops = entry.drops || [];
  var dropsEl = $('result-drops');
  if (won && drops.length > 0) {
    dropsEl.innerHTML = '<div class="result-drops-title">Loot Dropped</div><div class="loot-slots" id="loot-slots"></div>';
    dropsEl.style.display = '';
    var slotsEl = $('loot-slots');
    var slotData = [];
    drops.forEach(function(name) {
      var slot = document.createElement('div');
      slot.className = 'loot-slot sealed';
      slot.innerHTML = '<div class="loot-inner">?</div>';
      slotsEl.appendChild(slot);
      slotData.push({el: slot, name: name, r: lootRarityByName(name, entry.id)});
    });
    slotData.forEach(function(s, i) {
      setTimeout(function() {
        s.el.className = 'loot-slot revealed lr-' + s.r;
        s.el.querySelector('.loot-inner').textContent = s.name;
        lootSpawnBurst(s.el, s.r);
        lootFlash(s.r);
        if (s.r === 'epic' || s.r === 'legendary') lootShake(overlay.querySelector('.result-box'));
      }, 1200 + i * 700);
    });
  } else if (drops.length > 0) {
    var dHtml = '<div class="result-drops-title">Loot Dropped</div>';
    drops.forEach(function(d) { dHtml += '<span class="result-drop-item">' + d + '</span>'; });
    dropsEl.innerHTML = dHtml;
    dropsEl.style.display = '';
  } else {
    dropsEl.style.display = 'none';
  }

  var particles = $('result-particles');
  particles.innerHTML = '';
  if (won) {
    for (var i = 0; i < 30; i++) {
      var p = document.createElement('div');
      p.className = 'result-particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (2 + Math.random() * 3) + 's';
      p.style.animationDelay = Math.random() * 2 + 's';
      p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
      p.style.opacity = 0.4 + Math.random() * 0.6;
      var colors = ['var(--gold)', '#e0c050', '#ff8000', '#fff'];
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      particles.appendChild(p);
    }
  }

  $('active-section').style.display = 'none';
  $('items-section').style.display = 'none';
  $('log-section').style.display = 'none';
  $('select-section').style.display = 'none';
  $('history-section').style.display = 'none';
}

$('btn-new-raid').addEventListener('click', function() {
  resultShown = false;
  $('result-overlay').className = 'result-overlay';
  poll();
});

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
