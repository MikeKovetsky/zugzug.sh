<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peon-Ping — WC3 Base Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #ffab01;
  --dark-gold: #b8860b;
  --bg: #1a1a2e;
  --panel: #0d0d1a;
  --border: #3a3a5c;
  --text: #e0d8c8;
  --muted: #8a8472;
  --green: #4a8;
  --red: #c44;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Cinzel', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(26,26,46,0.8) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
}

/* Loading & Error */
#loading {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 2000;
  font-size: 18px; color: var(--gold);
  transition: opacity 0.5s;
}
#loading.done { opacity: 0; pointer-events: none; }
#error-banner {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 8px; background: #3a1a1a; color: var(--red);
  text-align: center; font-size: 12px; font-weight: 700;
  z-index: 1500; transform: translateY(-100%); transition: transform 0.3s;
}
#error-banner.on { transform: translateY(0); }

/* Toasts */
#toasts {
  position: fixed; top: 12px; right: 12px;
  z-index: 1000; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none; max-width: 340px;
}
.toast {
  pointer-events: auto;
  background: var(--panel); border: 2px solid var(--border);
  border-left: 4px solid var(--gold);
  padding: 10px 14px; border-radius: 4px; font-size: 12px;
  display: flex; align-items: center; gap: 8px;
  animation: toastIn 0.3s ease-out; cursor: pointer;
}
.toast:hover { border-color: var(--gold); }
.toast.out { animation: toastOut 0.3s ease-in forwards; }
.toast.t-err { border-left-color: var(--red); }
.toast.t-ach { border-color: var(--gold); }
.toast.t-evt { border-left-color: var(--green); }
.toast-icon { font-size: 18px; flex-shrink: 0; }
.toast-body { flex: 1; }
.toast-gd { color: var(--gold); font-weight: 700; white-space: nowrap; }
.toast-gd.neg { color: var(--red); }
@keyframes toastIn { from { opacity:0; transform:translateX(50px); } to { opacity:1; transform:translateX(0); } }
@keyframes toastOut { to { opacity:0; transform:translateX(80px); margin-top:-50px; } }

/* Control bar */
.ctrl-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 20px;
  background: linear-gradient(180deg, #22223a 0%, #1a1a2e 100%);
  border: 2px solid var(--border); border-bottom: none;
  border-radius: 4px 4px 0 0; font-size: 12px;
}
.ctrl-btn {
  background: none; border: 1px solid var(--border);
  color: var(--text); padding: 4px 10px; border-radius: 3px;
  cursor: pointer; font-family: inherit; font-size: 12px;
  transition: all 0.2s;
}
.ctrl-btn:hover { border-color: var(--gold); color: var(--gold); }
.ctrl-btn.off { color: var(--red); border-color: var(--red); }
.ctrl-sep { width: 1px; height: 20px; background: var(--border); }
.vol-slider {
  -webkit-appearance: none; appearance: none;
  width: 80px; height: 4px; background: var(--border);
  border-radius: 2px; outline: none; cursor: pointer;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  background: var(--gold); border-radius: 50%; cursor: pointer;
}
.pack-sel {
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 3px;
  padding: 3px 6px; font-family: inherit; font-size: 11px;
  cursor: pointer; max-width: 140px;
}
.pack-sel:focus { border-color: var(--gold); outline: none; }
.ctrl-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.ctrl-lbl { font-size: 11px; color: var(--muted); }
.day-night { font-size: 16px; }

.frame { max-width: 1100px; margin: 0 auto; padding: 12px; }

/* Resource bar */
.res-bar {
  display: flex; align-items: center; gap: 24px;
  padding: 10px 20px;
  background: linear-gradient(180deg, #2a2a3e 0%, #1a1a2e 100%);
  border: 2px solid var(--border); border-bottom: 3px solid var(--gold);
  border-top: none; flex-wrap: wrap;
}
.res-item { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 700; }
.res-icon { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
.res-gold { color: var(--gold); }
.res-lumber { color: #8B6914; }
.res-supply { color: var(--green); }
.res-right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.upkeep {
  font-size: 11px; padding: 2px 8px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
}
.upkeep-none { background: #2a4a2a; color: #6c6; }
.upkeep-low { background: #4a4a2a; color: #cc6; }
.upkeep-high { background: #4a2a2a; color: #c66; }
.goblin-badge {
  font-size: 11px; padding: 2px 8px; border-radius: 3px;
  background: #2a4a2a; color: var(--green); font-weight: 700;
  animation: pulse 2s infinite;
}
.streak-badge { font-size: 12px; color: var(--gold); }

/* Main grid */
.main-grid {
  display: grid; grid-template-columns: 240px 1fr;
  border: 2px solid var(--border); border-top: none;
}

/* Portrait panel */
.portrait-panel {
  background: linear-gradient(180deg, #12121f 0%, #0a0a14 100%);
  padding: 16px; border-right: 2px solid var(--border);
  display: flex; flex-direction: column; gap: 12px;
}
.portrait-frame {
  width: 100%; aspect-ratio: 1; background: #0a0a14;
  border: 3px solid var(--dark-gold); border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px; position: relative; overflow: hidden;
}
.portrait-frame::after {
  content: ''; position: absolute; inset: 0;
  border: 1px solid rgba(255,171,1,0.2); border-radius: 2px;
}
.stat-row {
  display: flex; justify-content: space-between; font-size: 13px;
  padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.sv { color: var(--gold); font-weight: 700; transition: color 0.3s; }
.flash-up { animation: flashG 0.6s; }
.flash-down { animation: flashR 0.6s; }
@keyframes flashG { 0%,100% { color: var(--gold); } 30% { color: #4c8; text-shadow: 0 0 8px rgba(68,204,136,0.6); } }
@keyframes flashR { 0%,100% { color: var(--gold); } 30% { color: #c44; text-shadow: 0 0 8px rgba(204,68,68,0.6); } }

.sass-meter { display: flex; gap: 3px; height: 8px; }
.sass-pip { flex: 1; background: #2a2a3e; border-radius: 2px; transition: background 0.3s; }
.sass-pip.on { background: var(--red); }
.sass-pip.on:nth-child(-n+2) { background: var(--gold); }
.combo-val { font-size: 14px; font-weight: 900; color: var(--gold); text-shadow: 0 0 8px rgba(255,171,1,0.5); }
.combo-bump { animation: bump 0.4s; }
@keyframes bump { 0%,100% { transform: scale(1); } 50% { transform: scale(1.4); } }

.debt-warn {
  text-align: center; padding: 6px; background: #3a1a1a; color: var(--red);
  font-size: 12px; font-weight: 700; border: 1px solid var(--red);
  border-radius: 3px; animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

/* Action buttons */
.act-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.act-btn {
  flex: 1; background: #1a1a2e; border: 1px solid var(--border);
  color: var(--text); padding: 6px 8px; border-radius: 3px;
  cursor: pointer; font-family: inherit; font-size: 11px;
  transition: all 0.2s; text-align: center;
}
.act-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.act-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.act-btn.bunkered { border-color: var(--green); color: var(--green); }
.hidden { display: none !important; }

/* Base panel */
.base-panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sec-title {
  font-size: 13px; color: var(--gold); text-transform: uppercase;
  letter-spacing: 2px; border-bottom: 1px solid var(--border);
  padding-bottom: 4px; margin-bottom: 4px;
}

/* Buildings */
.bld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.bld-card {
  background: #12121f; border: 2px solid var(--border);
  border-radius: 4px; padding: 10px; text-align: center;
  position: relative; transition: all 0.3s; cursor: default;
}
.bld-card.built { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,171,1,0.15); }
.bld-card.afford { cursor: pointer; }
.bld-card.afford:hover { border-color: var(--gold); transform: scale(1.03); box-shadow: 0 0 16px rgba(255,171,1,0.1); }
.bld-card.locked { opacity: 0.45; }
.bld-card.fresh { animation: builtFlash 0.8s; }
@keyframes builtFlash { 0% { box-shadow: 0 0 0 transparent; } 50% { box-shadow: 0 0 30px rgba(255,171,1,0.5); } 100% { box-shadow: 0 0 12px rgba(255,171,1,0.15); } }
.bld-icon { font-size: 28px; margin-bottom: 4px; }
.bld-name { font-size: 11px; font-weight: 700; }
.bld-cost { font-size: 10px; color: var(--muted); }
.bld-cost.poor { color: var(--red); }
.bld-disc { font-size: 9px; color: var(--green); font-weight: 700; }
.bld-confirm {
  margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border);
  display: flex; gap: 4px; justify-content: center;
}
.cfm-btn {
  background: none; border: 1px solid var(--border); color: var(--text);
  padding: 2px 10px; border-radius: 2px; cursor: pointer;
  font-family: inherit; font-size: 11px; transition: all 0.2s;
}
.cfm-btn.yes:hover { border-color: var(--green); color: var(--green); }
.cfm-btn.no:hover { border-color: var(--red); color: var(--red); }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 12px; }

/* Bottom grid */
.bot-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  border: 2px solid var(--border); border-top: none;
}
.ach-panel, .log-panel { padding: 12px 16px; max-height: 260px; overflow-y: auto; }
.ach-panel { border-right: 2px solid var(--border); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.ach-item {
  font-size: 11px; padding: 6px 8px; background: #12121f;
  border: 1px solid var(--border); border-radius: 3px;
  display: flex; align-items: center; gap: 6px;
  position: relative; transition: all 0.3s;
}
.ach-item.on { border-color: var(--gold); background: #1a1a0a; }
.ach-item.off { opacity: 0.35; }
.ach-item:hover .ach-tip { opacity: 1; transform: translateX(-50%) translateY(0); }
.ach-icon { font-size: 16px; }
.ach-tip {
  position: absolute; bottom: 100%; left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: var(--panel); border: 1px solid var(--gold);
  padding: 4px 8px; border-radius: 3px; font-size: 10px;
  white-space: nowrap; opacity: 0; pointer-events: none;
  transition: all 0.2s; z-index: 10;
}

.log-item {
  font-size: 11px; padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  display: flex; gap: 8px;
}
.log-time { color: var(--muted); min-width: 50px; }
.log-evt { flex: 1; }
.log-gd { color: var(--gold); }
.log-gd.neg { color: var(--red); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--panel); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Responsive */
@media (max-width: 768px) {
  .main-grid { grid-template-columns: 1fr; }
  .portrait-panel {
    border-right: none; border-bottom: 2px solid var(--border);
    flex-direction: row; flex-wrap: wrap; gap: 16px;
  }
  .portrait-frame { width: 120px; height: 120px; flex-shrink: 0; aspect-ratio: auto; }
  .p-stats { flex: 1; min-width: 150px; }
  .bot-grid { grid-template-columns: 1fr; }
  .ach-panel { border-right: none; border-bottom: 2px solid var(--border); }
}
@media (max-width: 480px) {
  .frame { padding: 6px; }
  .res-bar { gap: 12px; padding: 8px 12px; }
  .res-item { font-size: 14px; }
  .ctrl-bar { padding: 4px 12px; gap: 8px; flex-wrap: wrap; }
  .portrait-panel { padding: 12px; }
  .base-panel { padding: 12px; }
  .bld-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
}
</style>
</head>
<body>
<div id="loading">&#x23F3; Connecting to peon-ping...</div>
<div id="error-banner">Dashboard offline &mdash; retrying...</div>
<div id="toasts"></div>

<div class="frame">
  <div class="ctrl-bar">
    <button class="ctrl-btn" id="mute-btn" title="Toggle sounds">&#x1F50A; On</button>
    <div class="ctrl-sep"></div>
    <span class="ctrl-lbl">Vol</span>
    <input type="range" class="vol-slider" id="vol-slider" min="0" max="100" value="50">
    <div class="ctrl-sep"></div>
    <span class="ctrl-lbl">Pack</span>
    <select class="pack-sel" id="pack-sel"><option>peon</option></select>
    <div class="ctrl-r">
      <span class="day-night" id="day-night"></span>
    </div>
  </div>

  <div class="res-bar">
    <div class="res-item res-gold">
      <span class="res-icon">&#x1F4B0;</span>
      <span class="sv" id="gold">0</span>
    </div>
    <div class="res-item res-lumber">
      <span class="res-icon">&#x1FAB5;</span>
      <span class="sv" id="lumber">0</span>
    </div>
    <div class="res-item res-supply">
      <span class="res-icon">&#x1F3E0;</span>
      <span id="supply">0</span>
    </div>
    <div class="res-right">
      <span class="goblin-badge hidden" id="goblin-badge">&#x1F9CC; 50% OFF</span>
      <span id="upkeep" class="upkeep upkeep-none">NO UPKEEP</span>
      <span id="streak" class="streak-badge"></span>
    </div>
  </div>

  <div class="main-grid">
    <div class="portrait-panel">
      <div class="portrait-frame" id="portrait">&#x1F9CC;</div>
      <div class="p-stats">
        <div class="stat-row"><span>Pack</span><span class="sv" id="pack-name">peon</span></div>
        <div class="stat-row"><span>Tasks</span><span class="sv" id="tasks">0</span></div>
        <div class="stat-row"><span>Errors</span><span class="sv" id="errors">0</span></div>
        <div class="stat-row"><span>Sessions</span><span class="sv" id="sessions">0</span></div>
        <div class="stat-row"><span>Combo</span><span class="combo-val" id="combo">&mdash;</span></div>
        <div class="stat-row"><span>Sass</span><span id="sass-val">0</span></div>
        <div class="sass-meter" id="sass-meter">
          <div class="sass-pip"></div><div class="sass-pip"></div><div class="sass-pip"></div>
          <div class="sass-pip"></div><div class="sass-pip"></div>
        </div>
        <div id="debt-box"></div>
        <div class="act-btns" id="actions"></div>
      </div>
    </div>

    <div class="base-panel">
      <div class="sec-title">Base</div>
      <div class="bld-grid" id="buildings"></div>
      <div class="sec-title" style="margin-top:8px">Stats</div>
      <div class="stats-grid">
        <div class="stat-row"><span>Streak</span><span class="sv" id="streak-days">0 days</span></div>
        <div class="stat-row"><span>Best streak</span><span class="sv" id="best-streak">0 days</span></div>
        <div class="stat-row"><span>Max combo</span><span class="sv" id="max-combo">0x</span></div>
        <div class="stat-row"><span>Lifetime gold</span><span class="sv" id="lt-gold">0</span></div>
        <div class="stat-row"><span>Lifetime lumber</span><span class="sv" id="lt-lumber">0</span></div>
        <div class="stat-row"><span>Daily tasks</span><span class="sv" id="daily-tasks">0/80</span></div>
      </div>
    </div>
  </div>

  <div class="bot-grid">
    <div class="ach-panel">
      <div class="sec-title">Peon Honors</div>
      <div class="ach-grid" id="achievements"></div>
    </div>
    <div class="log-panel">
      <div class="sec-title">Activity</div>
      <div id="activity"></div>
    </div>
  </div>
</div>

<script>
var BLDS = {
  great_hall:   { icon: '\u{1F3F0}', name: 'Great Hall', g: 0, l: 0, free: true },
  stronghold:   { icon: '\u{1F3F0}', name: 'Stronghold', g: 500, l: 200 },
  fortress:     { icon: '\u{1F451}', name: 'Fortress', g: 2000, l: 800 },
  burrow:       { icon: '\u{1F573}\uFE0F', name: 'Burrow', g: 100, l: 50 },
  war_mill:     { icon: '\u2694\uFE0F', name: 'War Mill', g: 200, l: 100 },
  watch_tower:  { icon: '\u{1F5FC}', name: 'Watch Tower', g: 150, l: 75 },
  altar:        { icon: '\u26A1', name: 'Altar of Storms', g: 300, l: 150 },
  spirit_lodge: { icon: '\u{1F47B}', name: 'Spirit Lodge', g: 500, l: 200 },
  tavern:       { icon: '\u{1F37A}', name: 'Tavern', g: 400, l: 200 },
};

var ACHS = [
  { id: 'first_blood', icon: '\u{1FA78}', name: 'First Blood' },
  { id: 'zug_zug_veteran', icon: '\u2692\uFE0F', name: 'Zug Zug Veteran' },
  { id: 'night_elf', icon: '\u{1F319}', name: 'Night Elf' },
  { id: 'dawn_patrol', icon: '\u{1F305}', name: 'Dawn Patrol' },
  { id: 'weekend_warrior', icon: '\u{1F5E1}\uFE0F', name: 'Weekend Warrior' },
  { id: 'iron_peon', icon: '\u{1F4AA}', name: 'Iron Peon' },
  { id: 'rage_quit', icon: '\u{1F4A2}', name: 'Rage Quit' },
  { id: 'oops', icon: '\u{1F92D}', name: 'Oops' },
  { id: 'the_grind', icon: '\u26CF\uFE0F', name: 'The Grind' },
  { id: 'permit_patty', icon: '\u{1F6D1}', name: 'Permit Patty' },
  { id: 'compact_survivor', icon: '\u{1F6E1}\uFE0F', name: 'Compact Survivor' },
  { id: 'architect', icon: '\u{1F3D7}\uFE0F', name: 'Architect' },
  { id: 'bankrupt', icon: '\u{1F4B8}', name: 'Bankrupt' },
  { id: 'mogul', icon: '\u{1F4B0}', name: 'Mogul' },
];

var EVT_LABELS = {
  'session.start': 'Session Start',
  'task.complete': 'Task Complete',
  'task.error': 'Error',
  'task.acknowledge': 'Acknowledged',
  'input.required': 'Permission',
  'resource.limit': 'Context Limit',
  'user.spam': 'Spam Detected',
};

var EVT_ICONS = {
  'session.start': '\u{1F7E2}',
  'task.complete': '\u2705',
  'task.error': '\u274C',
  'task.acknowledge': '\u{1F44D}',
  'input.required': '\u23F8\uFE0F',
  'resource.limit': '\u26A0\uFE0F',
  'user.spam': '\u{1F501}',
};

var prev = null, curState = null, cfg = null, packs = [];
var fails = 0, lastSeenTs = 0, confirmBld = null;

function $(id) { return document.getElementById(id); }

function animVal(el, from, to, dur) {
  if (from === to) return;
  dur = dur || 300;
  var t0 = performance.now();
  var range = to - from;
  function step(now) {
    var p = Math.min((now - t0) / dur, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + range * ease).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function flash(el, dir) {
  el.classList.remove('flash-up', 'flash-down');
  void el.offsetWidth;
  el.classList.add(dir > 0 ? 'flash-up' : 'flash-down');
}

function addToast(type, icon, text, gd) {
  var c = $('toasts');
  while (c.children.length >= 3) c.firstChild.remove();
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' t-' + type : '');
  var h = '<span class="toast-icon">' + icon + '</span><span class="toast-body">' + text + '</span>';
  if (gd) {
    var cls = gd < 0 ? 'toast-gd neg' : 'toast-gd';
    h += '<span class="' + cls + '">' + (gd > 0 ? '+' : '') + gd + 'g</span>';
  }
  el.innerHTML = h;
  el.onclick = function() { killToast(el); };
  c.appendChild(el);
  setTimeout(function() { killToast(el); }, 4000);
}

function killToast(el) {
  if (!el.parentNode) return;
  el.classList.add('out');
  setTimeout(function() { el.remove(); }, 300);
}

function apiPost(path, body) {
  return fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); });
}

function today() { return new Date().toISOString().slice(0, 10); }

function updateDayNight() {
  var h = new Date().getHours();
  $('day-night').textContent = (h >= 6 && h < 18) ? '\u2600\uFE0F' : '\u{1F319}';
}

/* --- Section updaters --- */

function updateRes(s) {
  var ec = s.economy || {}, pe = prev ? (prev.economy || {}) : {};
  var g = ec.gold || 0, pg = pe.gold || 0;
  var l = ec.lumber || 0, pl = pe.lumber || 0;
  if (g !== pg) { animVal($('gold'), pg, g); flash($('gold'), g - pg); }
  if (l !== pl) { animVal($('lumber'), pl, l); flash($('lumber'), l - pl); }
  $('supply').textContent = Object.keys(s.session_packs || {}).length + '/12';
  var uk = ec.upkeep || 'none';
  var ub = $('upkeep');
  ub.textContent = uk === 'none' ? 'NO UPKEEP' : uk.toUpperCase() + ' UPKEEP';
  ub.className = 'upkeep upkeep-' + uk;
  var streak = (s.stats || {}).current_streak_days || 0;
  $('streak').textContent = streak > 0 ? streak + ' day streak' : '';
  var gb = $('goblin-badge');
  gb.classList.toggle('hidden', s.goblin_discount_date !== today());
}

function updatePortrait(s) {
  var st = s.stats || {}, ps = prev ? (prev.stats || {}) : {};
  $('pack-name').textContent = (s.last_active || {}).pack || 'peon';
  var tasks = st.tasks_completed || 0, pt = ps.tasks_completed || 0;
  if (tasks !== pt) { animVal($('tasks'), pt, tasks); flash($('tasks'), 1); }
  var errs = st.errors_total || 0, pe = ps.errors_total || 0;
  if (errs !== pe) { animVal($('errors'), pe, errs); flash($('errors'), -1); }
  $('sessions').textContent = st.sessions_total || 0;
  var combo = s.combo_count || 0, pc = prev ? (prev.combo_count || 0) : 0;
  var cel = $('combo');
  cel.textContent = combo > 0 ? combo + 'x' : '\u2014';
  if (combo > pc && prev) {
    cel.classList.remove('combo-bump');
    void cel.offsetWidth;
    cel.classList.add('combo-bump');
  }
  var sass = s.sass_level || 0;
  $('sass-val').textContent = sass;
  var pips = document.querySelectorAll('.sass-pip');
  for (var i = 0; i < pips.length; i++) pips[i].classList.toggle('on', i < sass);
  var debt = $('debt-box');
  if ((s.economy || {}).gold < 0) {
    debt.innerHTML = '<div class="debt-warn">IN DEBT: ' + s.economy.gold + ' gold</div>';
  } else { debt.innerHTML = ''; }
  $('streak-days').textContent = (st.current_streak_days || 0) + ' days';
  $('best-streak').textContent = (st.longest_streak_days || 0) + ' days';
  $('max-combo').textContent = (st.max_combo || 0) + 'x';
  $('lt-gold').textContent = (st.total_gold_earned || 0).toLocaleString();
  $('lt-lumber').textContent = (st.total_lumber_earned || 0).toLocaleString();
  $('daily-tasks').textContent = ((s.economy || {}).daily_tasks || 0) + '/80';
}

function updateBlds(s) {
  var built = s.buildings || {}, ec = s.economy || {};
  var g = ec.gold || 0, l = ec.lumber || 0;
  var disc = s.goblin_discount_date === today();
  var pBuilt = prev ? (prev.buildings || {}) : {};
  var grid = $('buildings');
  grid.innerHTML = '';
  Object.keys(BLDS).forEach(function(key) {
    var def = BLDS[key];
    var isBuilt = key === 'great_hall' || key in built;
    var fresh = prev && key !== 'great_hall' && (key in built) && !(key in pBuilt);
    var gc = def.g, lc = def.l;
    if (disc && !def.free) { gc = Math.floor(gc / 2); lc = Math.floor(lc / 2); }
    var afford = g >= gc && l >= lc;
    var card = document.createElement('div');
    var cls = 'bld-card';
    if (isBuilt) cls += ' built';
    else if (afford) cls += ' afford';
    else cls += ' locked';
    if (fresh) cls += ' fresh';
    card.className = cls;
    var h = '<div class="bld-icon">' + def.icon + '</div>';
    h += '<div class="bld-name">' + def.name + '</div>';
    if (!isBuilt && !def.free) {
      h += '<div class="bld-cost' + (afford ? '' : ' poor') + '">' + gc + 'g / ' + lc + 'l</div>';
      if (disc) h += '<div class="bld-disc">50% OFF!</div>';
      if (confirmBld === key) {
        h += '<div class="bld-confirm"><span style="font-size:10px">Build?</span>';
        h += '<button class="cfm-btn yes" data-b="' + key + '">\u2713</button>';
        h += '<button class="cfm-btn no">\u2717</button></div>';
      }
    }
    card.innerHTML = h;
    if (!isBuilt && afford && !def.free) {
      card.addEventListener('click', function(e) {
        if (e.target.closest('.cfm-btn')) return;
        confirmBld = key;
        if (curState) updateBlds(curState);
      });
    }
    grid.appendChild(card);
  });
  grid.querySelectorAll('.cfm-btn.yes').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var bname = btn.dataset.b;
      confirmBld = null;
      apiPost('/api/build', { building: bname }).then(function(res) {
        if (res.ok) {
          addToast('', '\u{1F3D7}\uFE0F', 'Construction complete: ' + BLDS[bname].name);
          poll();
        } else { addToast('err', '\u274C', res.error || 'Build failed'); }
      }).catch(function() { addToast('err', '\u274C', 'Build failed'); });
    });
  });
  grid.querySelectorAll('.cfm-btn.no').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      confirmBld = null;
      if (curState) updateBlds(curState);
    });
  });
}

function updateActions(s) {
  var built = s.buildings || {};
  var div = $('actions');
  div.innerHTML = '';
  if ('burrow' in built) {
    var btn = document.createElement('button');
    btn.className = 'act-btn';
    var now = Date.now() / 1000, until = s.bunker_until || 0;
    if (until > now) {
      btn.textContent = '\u{1F573}\uFE0F Bunker: ' + Math.ceil((until - now) / 60) + 'm';
      btn.className += ' bunkered';
      btn.disabled = true;
    } else {
      btn.textContent = '\u{1F573}\uFE0F Bunker';
      btn.addEventListener('click', function() {
        apiPost('/api/bunker').then(function(res) {
          if (res.ok) { addToast('', '\u{1F573}\uFE0F', 'Peon hiding! Roasts suppressed for 1 hour.'); poll(); }
        });
      });
    }
    div.appendChild(btn);
  }
  if ('altar' in built) {
    var btn2 = document.createElement('button');
    btn2.className = 'act-btn';
    if (s.last_resurrect_date === today()) {
      btn2.textContent = '\u26A1 Resurrected';
      btn2.disabled = true;
    } else {
      btn2.textContent = '\u26A1 Resurrect';
      btn2.addEventListener('click', function() {
        apiPost('/api/resurrect').then(function(res) {
          if (res.ok) {
            addToast('', '\u26A1', 'Peon call upon ancestors! Combo restored to ' + res.combo + 'x.');
            poll();
          } else { addToast('err', '\u274C', res.error || 'Resurrect failed'); }
        });
      });
    }
    div.appendChild(btn2);
  }
}

function updateAchs(s) {
  var unlocked = (s.stats || {}).achievements_unlocked || {};
  var pUnlocked = prev ? ((prev.stats || {}).achievements_unlocked || {}) : {};
  var grid = $('achievements');
  grid.innerHTML = '';
  ACHS.forEach(function(a) {
    var u = a.id in unlocked;
    var justGot = prev && u && !(a.id in pUnlocked);
    var el = document.createElement('div');
    el.className = 'ach-item ' + (u ? 'on' : 'off');
    var h = '<span class="ach-icon">' + a.icon + '</span><span>' + a.name + '</span>';
    if (u) {
      var d = new Date(unlocked[a.id] * 1000);
      h += '<span class="ach-tip">Unlocked ' + d.toLocaleDateString() + '</span>';
    }
    el.innerHTML = h;
    if (justGot) addToast('ach', '\u{1F3C6}', 'Achievement unlocked: ' + a.name);
    grid.appendChild(el);
  });
}

function updateLog(s) {
  var log = (s.activity_log || []).slice().reverse();
  var div = $('activity');
  div.innerHTML = '';
  log.slice(0, 30).forEach(function(entry) {
    var el = document.createElement('div');
    el.className = 'log-item';
    var t = new Date(entry.t * 1000);
    var time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    var label = EVT_LABELS[entry.e] || entry.e;
    var gd = entry.g || 0;
    var gdCls = gd < 0 ? 'log-gd neg' : 'log-gd';
    var gdText = gd !== 0 ? (gd > 0 ? '+' : '') + gd + 'g' : '';
    var extra = '';
    if (entry.c) extra += ' <b>' + entry.c + '</b>';
    if (entry.a) extra += ' \u{1F3C6} ' + entry.a;
    el.innerHTML = '<span class="log-time">' + time + '</span><span class="log-evt">' + label + extra + '</span><span class="' + gdCls + '">' + gdText + '</span>';
    div.appendChild(el);
  });
}

function detectToasts(s) {
  var log = s.activity_log || [];
  var maxTs = 0;
  for (var i = 0; i < log.length; i++) if ((log[i].t || 0) > maxTs) maxTs = log[i].t;
  if (lastSeenTs === 0) { lastSeenTs = maxTs; return; }
  for (var j = 0; j < log.length; j++) {
    var entry = log[j];
    if ((entry.t || 0) <= lastSeenTs) continue;
    var label = EVT_LABELS[entry.e] || entry.e;
    var icon = EVT_ICONS[entry.e] || '\u{1F4CB}';
    var type = '';
    if (entry.e === 'task.error' || entry.e === 'resource.limit') type = 'err';
    var text = label;
    if (entry.c) text += ' \u2014 ' + entry.c;
    if (entry.a) { type = 'ach'; icon = '\u{1F3C6}'; text += ' \u2014 ' + entry.a; }
    addToast(type, icon, text, entry.g || null);
  }
  if (maxTs > lastSeenTs) lastSeenTs = maxTs;
}

/* --- Controls --- */

function updateCtrls() {
  if (!cfg) return;
  var mute = $('mute-btn');
  if (cfg.enabled === false) {
    mute.innerHTML = '\u{1F507} Off';
    mute.classList.add('off');
  } else {
    mute.innerHTML = '\u{1F50A} On';
    mute.classList.remove('off');
  }
  $('vol-slider').value = Math.round((cfg.volume || 0.5) * 100);
  var sel = $('pack-sel');
  var cur = cfg.active_pack || 'peon';
  if (packs.length && sel.options.length !== packs.length) {
    sel.innerHTML = '';
    packs.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      sel.appendChild(opt);
    });
  }
  sel.value = cur;
}

$('mute-btn').addEventListener('click', function() {
  if (!cfg) return;
  var v = cfg.enabled === false;
  apiPost('/api/config', { enabled: v }).then(function() {
    cfg.enabled = v;
    updateCtrls();
  });
});

var volTimer = null;
$('vol-slider').addEventListener('input', function(e) {
  clearTimeout(volTimer);
  var val = parseInt(e.target.value);
  volTimer = setTimeout(function() {
    apiPost('/api/config', { volume: val / 100 }).then(function() {
      if (cfg) cfg.volume = val / 100;
    });
  }, 300);
});

$('pack-sel').addEventListener('change', function(e) {
  apiPost('/api/config', { active_pack: e.target.value }).then(function() {
    if (cfg) cfg.active_pack = e.target.value;
  });
});

document.addEventListener('click', function(e) {
  if (confirmBld && !e.target.closest('.bld-card')) {
    confirmBld = null;
    if (curState) updateBlds(curState);
  }
});

/* --- Main loop --- */

function update(state) {
  detectToasts(state);
  updateRes(state);
  updatePortrait(state);
  updateBlds(state);
  updateActions(state);
  updateAchs(state);
  updateLog(state);
  prev = JSON.parse(JSON.stringify(state));
  curState = state;
  var g = (state.economy || {}).gold || 0;
  document.title = 'Peon-Ping | ' + g.toLocaleString() + 'g';
}

function poll() {
  return fetch('/api/state').then(function(r) {
    if (r.ok) return r.json();
    throw new Error(r.status);
  }).then(function(state) {
    update(state);
    fails = 0;
    $('loading').classList.add('done');
    $('error-banner').classList.remove('on');
  }).catch(function() {
    fails++;
    if (fails >= 3) $('error-banner').classList.add('on');
  });
}

function pollCfg() {
  return fetch('/api/config').then(function(r) {
    if (r.ok) return r.json();
  }).then(function(c) {
    if (c) { cfg = c; updateCtrls(); }
  }).catch(function() {});
}

function loadPacks() {
  return fetch('/api/packs').then(function(r) {
    if (r.ok) return r.json();
  }).then(function(p) {
    if (p) { packs = p; updateCtrls(); }
  }).catch(function() {});
}

updateDayNight();
setInterval(updateDayNight, 60000);
loadPacks();
pollCfg();
poll();
setInterval(poll, 2000);
setInterval(pollCfg, 5000);
</script>
</body>
